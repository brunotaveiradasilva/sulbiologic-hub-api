server:
  port: ${PORT:8080}

spring:
  application:
    name: almoxarifado-api

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/almoxarifado}
    username: ${DB_USERNAME:almoxarifado}
    password: ${DB_PASSWORD:almoxarifado}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  # Origens que podem chamar a API (separadas por vírgula).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://brunotaveiradasilva.github.io}

  # Assina os tokens de login. O padrão abaixo só serve para rodar local — troque com
  # JWT_SECRET antes de expor a API na internet (ver README).
  jwt:
    secret: ${JWT_SECRET:chave-de-desenvolvimento-local-troque-isto-em-producao-0123456789}
    validade-horas: ${JWT_VALIDADE_HORAS:168}

  # Login criado sozinho na primeira vez que a API sobe sem o usuário ADMIN_USERNAME cadastrado.
  # RESET_ADMIN_PASSWORD=true força recriar a senha dele mesmo que já exista (ver
  # BootstrapUsuarioAdmin) -- desative de novo depois de usar.
  admin:
    usuario: ${ADMIN_USERNAME:admin}
    senha: ${ADMIN_PASSWORD:}
    forcar-reset: ${RESET_ADMIN_PASSWORD:false}

  # Credenciais da API da ADS (histórico de vendas), usadas por com.almoxarifado.api.ads pra
  # calcular o "realizado" das metas todo dia de madrugada (ver AdsSincronizacaoService). Autentica
  # só com os headers x-api-key/User-Agent, direto em produção (adsapi.com.br) — ver README.
  ads:
    base-url: ${ADS_API_URL:https://adsapi.com.br}
    api-key: ${ADS_API_KEY:}
    user-agent: ${ADS_USER_AGENT:SulBiologic}
    especifico-id: ${ADS_ESPECIFICO_ID:074}
    cnpj-distribuidora: ${ADS_CNPJ_DISTRIBUIDORA:}

  # Jobs diários das 6h dentro da própria API (ver config/AgendadorConfig). No Cloud Run fica false
  # e o Cloud Scheduler chama POST /api/interno/sincronizacao-diaria com o header X-Cron-Token igual
  # a CRON_TOKEN (sem CRON_TOKEN essa rota fica desligada).
  agendador-interno: ${AGENDADOR_INTERNO:true}
  cron-token: ${CRON_TOKEN:}
